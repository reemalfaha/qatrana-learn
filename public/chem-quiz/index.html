<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دولاب الكيمياء · منصة القطرانة</title>
<meta name="theme-color" content="#7A1F2E">

<style>

body{margin:0;background:radial-gradient(120% 90% at 80% 0%,#fff 0%,var(--bg) 55%,#f3e7df 100%);color:var(--ink);font:18px/1.6 var(--f);display:flex;flex-direction:column}

@media (max-width:820px){.stage{grid-template-columns:1fr}}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font:700 clamp(18px,2.2vw,26px) var(--f);border:0;border-radius:16px;padding:12px 28px;background:var(--w);color:#fff;cursor:pointer;min-height:56px}
.btn.g{background:transparent;color:var(--w);border:2.5px solid var(--w)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:8px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.wheelBox svg{transition-duration:.01s}}
</style>
