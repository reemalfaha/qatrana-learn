<style>
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding-bottom:4px}
.tabs button{flex:none;font:700 14px var(--f);border:1.5px solid var(--ln);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--w);color:#fff;border-color:var(--w)}
.stack{display:flex;flex-direction:column;gap:12px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sum{background:var(--soft);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;display:flex;gap:14px;flex-wrap:wrap;font-weight:700}
.sum b{color:var(--w)}
.qc{border-inline-start:6px solid var(--c,var(--w))}
.qc .qh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qc .tg{font:700 13px var(--f);background:var(--soft);border-radius:999px;padding:2px 10px;color:var(--w)}
.opt{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.opt input[type=radio]{width:22px;height:22px;accent-color:var(--w);flex:none}
.opt .l{font-weight:700;width:22px;flex:none;text-align:center}
.mk{width:90px!important}
.tfb{display:flex;gap:8px}
.tfb label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ln);border-radius:12px;min-height:44px;font-weight:700;cursor:pointer}
.tfb input{accent-color:var(--w);width:20px;height:20px}
details.card summary{cursor:pointer;font-weight:700}

.qrb{display:flex;justify-content:center;padding:10px}.qrb canvas{max-width:260px;width:100%;height:auto;border:6px solid #fff;border-radius:8px}
.lnk{direction:ltr;text-align:left;font:12px/1.4 monospace;word-break:break-all;max-height:90px;overflow:auto;background:var(--soft);border-radius:10px;padding:8px}

.paperwrap{overflow-x:auto}
.paper{background:#fff;color:#111;max-width:210mm;margin:0 auto;padding:12mm 12mm 10mm;border:1px solid var(--ln);box-shadow:0 6px 20px rgba(60,20,30,.1);font:13pt/1.75 "Noto Naskh Arabic","Sakkal Majalla",serif;min-width:640px}
.paper *{box-sizing:border-box}
.ph{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:center;border-bottom:3px double #7A1F2E;padding-bottom:6px;font-size:11pt}
.ph .c{text-align:center}.ph .c b{font:700 17pt "El Messiri",serif;color:#7A1F2E;display:block;line-height:1.3}
.ph .l{text-align:left;direction:rtl}
.stu{display:flex;gap:14px;justify-content:space-between;margin:8px 0;font-weight:700;font-size:11.5pt}
.stu span{flex:1;border-bottom:1px dotted #555;white-space:nowrap}
.stu .mk2{flex:none;border:1.5px solid #7A1F2E;border-radius:8px;padding:0 10px}
.pin{font-size:11pt;border:1px solid #B8902A;background:#fbf4de;border-radius:8px;padding:2px 10px;margin:6px 0}
.pg{margin-top:10px;break-inside:avoid-page}
.pg>h3{font:700 13.5pt "El Messiri",serif;background:#f3e6e8;border-inline-start:6px solid #7A1F2E;margin:0 0 4px;padding:2px 10px;display:flex;justify-content:space-between;gap:10px}
.pq{margin:4px 0 6px;break-inside:avoid}
.pq .qt{display:flex;gap:6px}.pq .qt .n{font-weight:700;flex:none}.pq .qt .m{flex:none;font-size:10.5pt;color:#555;margin-inline-start:auto;white-space:nowrap}
.po{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;padding-inline-start:22px}
.po.one{grid-template-columns:1fr}
.po div.ok,.key-a{color:#7A1F2E;font-weight:700}
.po div.ok:after{content:" ✓"}
.ln{border-bottom:1px dotted #777;height:26px}
.key-a{background:#fbf4de;border-radius:6px;padding:0 8px;display:inline-block;margin-top:2px}
.pf{margin-top:14px;border-top:1px solid #B8902A;padding-top:4px;display:flex;justify-content:space-between;font-size:9.5pt;color:#555}
.endn{text-align:center;font-weight:700;margin-top:10px;color:#7A1F2E}
/* student */
.sq{margin-bottom:12px}
.sq .qt{font-weight:700;margin-bottom:6px}
.so{display:flex;gap:10px;align-items:center;border:1.5px solid var(--ln);border-radius:12px;padding:8px 12px;margin-bottom:6px;min-height:44px;cursor:pointer;background:var(--card)}
.so input{accent-color:var(--w);width:20px;height:20px}
.so.ok{border-color:#1F7A4D;background:#e6f4ec}.so.no{border-color:#B3261E;background:#fbe9e7}
@media (prefers-color-scheme:dark){.so.ok{background:#173225}.so.no{background:#3a1a18}}
.res{font:700 22px var(--fd);text-align:center;color:var(--w)}
.fb{font-size:14px;margin-top:4px}
.fb.ok{color:#1F7A4D}.fb.no{color:#B3261E}
@media (max-width:640px){.paper{min-width:0;padding:8mm}.ph{grid-template-columns:1fr;text-align:center}.ph .l{text-align:center}}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff!important}
  .noprint,.top,.tabs,.toast{display:none!important}
  main{padding:0!important;max-width:none!important}
  .paperwrap{overflow:visible}
  .paper{border:0;box-shadow:0;padding:0;max-width:none;min-width:0}
}
</style>
</head>

<script>
"use strict";
const $=s=>document.querySelector(s);
function h(t,a,...c){const e=document.createElement(t);for(const k in a||{}){const v=a[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else if(k==="checked")e.checked=!!v;else e.setAttribute(k,v===true?"":v)}c.flat(9).forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)))});return e}

  fill:{n:"إكمال الفراغ",ic:"✏️",c:"#2F6FB0",inst:"أكملي الفراغات الآتية بما يناسبها:",m:1},

const ORDER=["mcq","tf","fill","short","essay"];
/* ---------- storage ---------- */
const KEY="exb.v1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.exams))S={exams:[],bank:[],cur:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("تعذّر الحفظ على الجهاز")}}
const uid=()=>Math.random().toString(36).slice(2,9);
function newExam(){return{id:uid(),meta:{title:"اختبار قصير",school:"مدرسة القطرانة الثانوية للبنات",teacher:"",subject:"",grade:"",term:"الفصل الدراسي الأول",date:"",time:"",instr:"",showAns:true},qs:[]}}
function cur(){return S.exams.find(e=>e.id===S.cur)}
function ensure(){if(!cur()){const e=newExam();S.exams.push(e);S.cur=e.id;save()}return cur()}
function newQ(t){return{id:uid(),t,q:"",opts:t==="mcq"?["","","",""]:[],a:t==="mcq"?0:t==="tf"?true:"",m:TYPES[t].m,lines:t==="essay"?5:3}}
const marks=ex=>ex.qs.reduce((s,q)=>s+(+q.m||0),0);
/* ---------- helpers ---------- */
function norm(s){return String(s||"").replace(/[ً-ْـ]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^؀-ۿa-zA-Z0-9]+/g," ").trim().toLowerCase()}
function rng(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function groupsOf(ex,ver){const r=rng(ex.id+"B");return ORDER.map(t=>{let qs=ex.qs.filter(q=>q.t===t&&q.q.trim());if(ver==="B"){qs=shuffle(qs,r).map(q=>{if(q.t!=="mcq")return q;const idx=shuffle(q.opts.map((_,i)=>i).filter(i=>q.opts[i].trim()),r);return{...q,opts:idx.map(i=>q.opts[i]),a:idx.indexOf(q.a)}})}return{t,qs}}).filter(g=>g.qs.length)}
function blank(s){return String(s).replace(/_{2,}|\.{4,}|…+/g,"________")}
/* ---------- state ---------- */
let tab="list";
const TABS=[["list","امتحاناتي"],["info","المعلومات"],["qs","الأسئلة"],["bank","بنك أسئلتي"],["prev","معاينة وطباعة"],["share","رابط للطالبات"]];
function nav(t){tab=t;render();window.scrollTo(0,0)}
function shell(body){return[h("div",{class:"tabs noprint",role:"tablist"},TABS.map(([k,n])=>h("button",{"aria-current":k===tab?"true":"false",onclick:()=>nav(k)},n))),body]}
function render(){app.replaceChildren();const ex=cur();let v;
  if(tab==="list")v=vList();else if(!ex){tab="list";v=vList()}
  else v=({info:vInfo,qs:vQs,bank:vBank,prev:vPrev,share:vShare})[tab](ex);
  app.append(...shell(v))}
/* ---------- list ---------- */
function vList(){
  const box=h("div",{class:"stack"});
  box.append(h("div",{class:"hero"},h("h1",{},"صمّمي ",h("span",{},"امتحانك"), " بنفسك"),h("p",{},"اختيار من متعدد، صح وخطأ، إكمال، إجابة قصيرة ومقالي. تحصلين على ورقة جاهزة A4 مع مفتاح إجابة ونسخة ب، أو رابط للطالبات يصحّح الأسئلة الموضوعية تلقائيًا."),h("div",{class:"chips"},h("span",{},"بدون حساب"),h("span",{},"من الجوال"),h("span",{},"مجاني"))));
  box.append(h("div",{class:"bar2"},h("button",{class:"btn",onclick:()=>{const e=newExam();S.exams.unshift(e);S.cur=e.id;save();nav("info")}},"➕ امتحان جديد"),h("button",{class:"btn g",onclick:()=>{const t=prompt("الصقي هنا النص المنسوخ من نسخة احتياطية (JSON):");if(!t)return;try{const o=JSON.parse(t);if(o.exams)S.exams.push(...o.exams.filter(x=>!S.exams.some(y=>y.id===x.id)));if(o.bank)S.bank.push(...o.bank.filter(x=>!S.bank.some(y=>y.id===x.id)));save();render();toast("تم الاستيراد")}catch(e){toast("النص غير صالح")}}},"⬆️ استيراد"),h("button",{class:"btn g",onclick:async()=>{const t=JSON.stringify({exams:S.exams,bank:S.bank});try{await navigator.clipboard.writeText(t);toast("نُسخت النسخة الاحتياطية. الصقيها في ملاحظاتك")}catch(e){prompt("انسخي النص:",t)}}},"⬇️ نسخة احتياطية")));
  if(!S.exams.length)box.append(h("div",{class:"card muted"},"ما عندك امتحانات بعد. ابدئي بـ «امتحان جديد»."));
  S.exams.forEach(e=>box.append(h("div",{class:"card",style:e.id===S.cur?"border-color:var(--g);border-width:2px":""},
    h("div",{style:"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"},
      h("div",{},h("b",{},e.meta.title||"بدون عنوان"),h("div",{class:"muted small"},[e.meta.subject,e.meta.grade,e.qs.length+" سؤال",marks(e)+" علامة"].filter(Boolean).join(" · "))),
      h("div",{class:"bar2"},
        h("button",{class:"btn sm",onclick:()=>{S.cur=e.id;save();nav("qs")}},"فتح"),
        h("button",{class:"btn sm g",onclick:()=>{const c=JSON.parse(JSON.stringify(e));c.id=uid();c.meta.title+=" (نسخة)";S.exams.unshift(c);S.cur=c.id;save();render()}},"نسخ"),
        h("button",{class:"btn sm g",onclick:()=>{if(confirm("حذف هذا الامتحان؟")){S.exams=S.exams.filter(x=>x.id!==e.id);if(S.cur===e.id)S.cur=S.exams[0]?.id||null;save();render()}}},"حذف"))))));
  box.append(h("p",{class:"muted small"},"تُحفظ امتحاناتك على جهازك فقط. خذي نسخة احتياطية قبل تغيير الجوال أو مسح بيانات المتصفح."));
  return box}
/* ---------- info ---------- */
function vInfo(ex){
  const m=ex.meta;const f=(k,l,ph)=>h("label",{class:"f"},l,h("input",{class:"in",value:m[k]||"",placeholder:ph||"",oninput:e=>{m[k]=e.target.value;save()}}));
  return h("div",{class:"card stack"},h("h2",{style:"margin:0"},"معلومات الامتحان"),
    h("div",{class:"row"},f("title","عنوان الامتحان","مثال: اختبار الوحدة الأولى"),f("subject","المبحث","الأحياء"),f("grade","الصف والشعبة","العاشر")),
    h("div",{class:"row"},f("school","المدرسة"),f("teacher","اسم المعلمة"),f("term","الفصل")),
    h("div",{class:"row"},f("date","التاريخ","2026/11/07"),f("time","الزمن","45 دقيقة")),
    h("label",{class:"f"},"تعليمات تظهر أعلى الورقة (اختياري)",h("textarea",{class:"in",oninput:e=>{m.instr=e.target.value;save()}},m.instr||"")),
    h("label",{class:"so",style:"cursor:pointer"},h("input",{type:"checkbox",checked:m.showAns!==false,onchange:e=>{m.showAns=e.target.checked;save()}}),"في رابط الطالبات: إظهار الإجابات الصحيحة بعد التسليم"),
    h("button",{class:"btn",onclick:()=>nav("qs")},"التالي: الأسئلة ←"))}
/* ---------- questions ---------- */
function qCard(ex,q,i){
  const n=ex.qs.length;const T=TYPES[q.t];
  const mv=d=>{const j=i+d;if(j<0||j>=n)return;[ex.qs[i],ex.qs[j]]=[ex.qs[j],ex.qs[i]];save();render()};
  let body;
  const qtxt=h("textarea",{class:"in",placeholder:q.t==="fill"?"اكتبي الجملة وضعي ____ مكان الفراغ":"نص السؤال",oninput:e=>{q.q=e.target.value;save()}},q.q);
  if(q.t==="mcq")body=h("div",{},q.opts.map((o,k)=>h("div",{class:"opt"},h("input",{type:"radio",name:"c"+q.id,checked:q.a===k,"aria-label":"الإجابة الصحيحة "+LET[k],onchange:()=>{q.a=k;save()}}),h("span",{class:"l"},LET[k]),h("input",{class:"in",value:o,placeholder:"الخيار "+LET[k],oninput:e=>{q.opts[k]=e.target.value;save()}}))),h("div",{class:"hint"},"اضغطي الدائرة بجانب الخيار الصحيح. الخيارات الفارغة تُحذف تلقائيًا."));
  else if(q.t==="tf")body=h("div",{class:"tfb"},[["صح",true],["خطأ",false]].map(([l,v])=>h("label",{},h("input",{type:"radio",name:"c"+q.id,checked:q.a===v,onchange:()=>{q.a=v;save()}}),l)));
  else if(q.t==="fill")body=h("div",{},h("label",{class:"f"},"الإجابة الصحيحة (لأكثر من إجابة مقبولة افصلي بـ | )",h("input",{class:"in",value:q.a||"",oninput:e=>{q.a=e.target.value;save()}})),h("button",{class:"btn sm g",style:"margin-top:6px",onclick:()=>{qtxt.value+=" ________";q.q=qtxt.value;save();qtxt.focus()}},"＋ إدراج فراغ ____"));
  else body=h("div",{class:"row"},h("label",{class:"f",style:"grid-column:1/-1"},"الإجابة النموذجية (اختياري، تظهر في المفتاح)",h("textarea",{class:"in",oninput:e=>{q.a=e.target.value;save()}},q.a||"")),h("label",{class:"f"},"عدد أسطر الإجابة",h("input",{class:"in",type:"number",min:1,max:15,value:q.lines||3,oninput:e=>{q.lines=+e.target.value||3;save()}})));
  return h("div",{class:"card qc",style:"--c:"+T.c},
    h("div",{class:"qh"},h("span",{class:"tg"},T.ic+" "+T.n+" · س"+(i+1)),h("label",{class:"f",style:"flex-direction:row;align-items:center;gap:6px"},"العلامة",h("input",{class:"in mk",type:"number",min:0,step:"0.5",value:q.m,oninput:e=>{q.m=+e.target.value||0;save()}}))),
    qtxt,h("div",{style:"height:8px"}),body,
    h("div",{class:"bar2",style:"margin-top:10px"},
      h("button",{class:"btn sm g",onclick:()=>mv(-1),"aria-label":"أعلى"},"↑"),h("button",{class:"btn sm g",onclick:()=>mv(1),"aria-label":"أسفل"},"↓"),
      h("button",{class:"btn sm g",onclick:()=>{ex.qs.splice(i+1,0,{...JSON.parse(JSON.stringify(q)),id:uid()});save();render()}},"نسخ"),
      h("button",{class:"btn sm g",onclick:()=>{if(!q.q.trim())return toast("اكتبي السؤال أولًا");S.bank.unshift({...JSON.parse(JSON.stringify(q)),id:uid(),tag:ex.meta.subject||""});save();toast("حُفظ في بنك أسئلتي")}},"💾 للبنك"),
      h("button",{class:"btn sm g",onclick:()=>{ex.qs.splice(i,1);save();render()}},"🗑 حذف")))}
function parseBulk(txt){
  const out=[];
  txt.replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).forEach(b=>{
    const lines=b.split("\n").map(l=>l.trim()).filter(Boolean);
    const q=lines.shift().replace(/^(?:س\s*\d*|\d+)\s*[\)\.\-:：]\s*/,"");
    const opts=[];let ans=null;
    lines.forEach(l=>{
      const a=l.match(/^(?:الإجابة|الاجابة|الجواب)\s*[:：]\s*(.+)$/);
      if(a){ans=a[1].trim();return}
      const m=l.match(/^(\*)?\s*([أبجدabcdABCD])\s*[\)\.\-:]\s*(.+?)\s*(\*)?$/);
      if(m){opts.push(m[3]);if(m[1]||m[4])ans=opts.length-1}
    });
    let o;
    if(opts.length>=2){o=newQ("mcq");o.opts=[...opts.slice(0,4)];while(o.opts.length<4)o.opts.push("");
      if(typeof ans==="string"){const i="أبجد".indexOf(ans[0]);const j="abcd".indexOf(ans[0].toLowerCase());ans=i>=0?i:j>=0?j:0}
      o.a=typeof ans==="number"&&ans<4?ans:0}
    else if(ans&&/^(صح|صحيحة|صحيح|✓|√|خطأ|خاطئة|خطا|✗|×)$/.test(ans)){o=newQ("tf");o.a=/^(صح|صحيحة|صحيح|✓|√)$/.test(ans)}
    else if(/_{2,}|\.{4,}|…/.test(q)){o=newQ("fill");o.a=ans||""}
    else{o=newQ("short");o.a=ans||""}
    o.q=o.t==="fill"?blank(q):q;out.push(o)});
  return out}
