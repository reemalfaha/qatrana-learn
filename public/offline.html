<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لا يوجد اتصال — منصة القطرانة</title>
<meta name="theme-color" content="#7A1F2E">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF7F3;color:#2B1218;font-family:'Cairo',system-ui,sans-serif;text-align:center;padding:20px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#1a1114;color:#f5e9ec}}
.box{max-width:380px}img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 20px rgba(92,22,34,.25)}
h1{font-family:'El Messiri','Cairo',serif;color:#7A1F2E;font-size:26px;margin:18px 0 8px}
@media (prefers-color-scheme:dark){h1{color:#F3DFA8}}
p{line-height:1.8;margin:0 0 18px}
button{font:inherit;font-weight:700;background:#7A1F2E;color:#fff;border:2px solid #B8902A;border-radius:30px;padding:10px 26px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="">
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>هذه الصفحة لم تُفتح من قبل على هذا الجهاز، لذلك تحتاج إلى الإنترنت.<br>الصفحات التي فُتحت سابقًا تعمل بدون إنترنت.</p>
  <button onclick="location.reload()">🔄 إعادة المحاولة</button>
</div>
</body>
</html>
