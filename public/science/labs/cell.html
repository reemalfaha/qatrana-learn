 cent:['المريكزات','Centrioles','تنظيم خيوط المغزل في أثناء انقسام الخلية الحيوانية.','أسطوانتان متعامدتان تتكوّن كلٌّ منهما من أنيبيبات دقيقة.',1,0],

 chl:['البلاستيدات الخضراء','Chloroplasts','القيام بعملية البناء الضوئي وصنع الغذاء.','تحتوي أغشية الثايلاكويد المتراصّة (الغرانا) التي يوجد فيها الكلوروفيل لامتصاص الضوء.',0,1],

 info.append(h("div","motto","«التركيب يخدم الوظيفة»"));}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),t.length>40?3800:1700);}
function pick(k){if(quiz){quiz.n++;if(k===quiz.k){quiz.ok++;quiz.done.add(k);toast("✅ أحسنتِ! هذه "+nm(k));sel=k;nextQ();}else{toast("❌ هذه "+nm(k)+" — حاولي مرّة أخرى");sel=k;paint();showInfo();}return;}
 sel=sel===k?null:k;paint();showInfo();document.getElementById("hint").style.display="none";if(sel&&innerWidth<900)toast("🔎 "+nm(sel).replace(/ \(.*\)/,"")+": "+INF[sel][2]);}
function nextQ(){const left=ORDER[view].filter(x=>!quiz.done.has(x));if(!left.length){toast("🏆 ممتاز! أنهيتِ كل الأجزاء: "+quiz.ok+" / "+quiz.n);const b=document.getElementById("bQuiz");quiz=null;b.classList.remove("on");b.textContent="🎯 اختبري نفسك";paint();showInfo();return;}
 quiz.k=left[Math.floor(Math.random()*left.length)];paint();showInfo();}
sv.addEventListener("click",()=>{if(sel&&!quiz){sel=null;paint();showInfo();}});
function cmp(){const d=document.getElementById("cmp");d.innerHTML="";const im=document.createElement("img");im.src="img/cell-compare.webp";im.alt="مقارنة بين الخلية الحيوانية والخلية النباتية";im.className="cmpimg";
 const t=document.createElement("table");t.innerHTML="<tr><th>الجزء</th><th>🐾 الخلية الحيوانية</th><th>🌿 الخلية النباتية</th></tr>"+Object.keys(INF).filter(k=>k!=="vacs").map(k=>`<tr><td>${INF[k][0]}</td><td class="${INF[k][4]?"y":"n"}">${INF[k][4]?"✓ موجود":"✗ غير موجود"}</td><td class="${INF[k][5]?"y":"n"}">${INF[k][5]?"✓ موجود":"✗ غير موجود"}</td></tr>`).join("");
 const p=document.createElement("p");p.className="card";p.style.marginTop="12px";p.innerHTML="📌 <b>تنفرد الخلية النباتية</b> بالجدار الخلوي والبلاستيدات الخضراء والفجوة العصارية المركزية الكبيرة، و<b>تنفرد الخلية الحيوانية</b> بالمريكزات والجسيمات الحالّة، وفجواتها صغيرة متعدّدة.";d.append(im,t,p);}

/* معرض الصور المجهرية */
const PCELLS=[["epi","خلايا البشرة","خلايا رقيقة شفّافة تغطي سطح النبات وتحميه."],["grd","الخلايا الحارسة","تتحكّم في فتح الثغور وإغلاقها لتنظيم تبادل الغازات وفقدان الماء."],["pal","خلايا النسيج العمادي","تحتوي عددًا كبيرًا من البلاستيدات الخضراء وتقوم بعملية البناء الضوئي."],["spg","خلايا النسيج الإسفنجي","تحتوي بلاستيدات خضراء، وبينها فراغات هوائية تسهّل تبادل الغازات."],
 ["xyl","خلايا الخشب","خلايا ميتة ذات جدران سميكة تنقل الماء والأملاح المعدنية من الجذور إلى باقي أجزاء النبات."],["phl","خلايا اللحاء","خلايا حيّة تنقل الغذاء الجاهز (السكّريات) من الأوراق إلى باقي أجزاء النبات."],["par","الخلايا البرنشيمية","خلايا حيّة رقيقة الجدران تقوم بالتخزين والبناء الضوئي والدعم."],["col","الخلايا الكولنشيمية","خلايا حيّة جدرانها غير متساوية السمك، توفّر الدعامة للأجزاء الفتيّة في النبات."],["scl","الخلايا السكلرنشيمية","خلايا ميتة جدرانها سميكة ملجننة، توفّر الدعامة والحماية للنبات."]];
const PEX=[["lea","خلايا ورقة النبات","تحتوي بلاستيدات خضراء."],["roo","خلايا جذر النبات","تخزّن الماء والمواد الغذائية، ولا تحتوي بلاستيدات خضراء."],["fru","خلايا ثمرة النبات","تخزّن المواد الغذائية والصبغات."]];
const BACT=[["cocc","البكتيريا الكروية (كرويات)","مكوّرات العنقود الذهبية","Staphylococcus aureus","كروية الشكل، وقد تتجمّع في عناقيد أو سلاسل."],["bacl","البكتيريا العصوية (عصيّات)","الإشريكية القولونية","Escherichia coli","عصوية الشكل (أسطوانية) تعيش في أمعاء الإنسان."],["spir","البكتيريا الحلزونية (حلزونات)","اللولبية البوّابية","Helicobacter pylori","حلزونية ملتوية، وتسبّب بعض قرح المعدة."],["vib","البكتيريا الضمّة (ضمّيات)","الضمّة الكوليرية","Vibrio cholerae","تشبه الفاصلة (،) ولها سوط، وتسبّب مرض الكوليرا."]];
function lbx(src,t){const d=document.createElement("div");d.className="lbx";d.innerHTML="<img alt=''><b></b><span>اضغطي للإغلاق</span>";d.querySelector("img").src=src;d.querySelector("b").textContent=t;d.onclick=()=>d.remove();document.body.append(d);}
function gallery(v){const g=document.getElementById("gal");g.innerHTML="";const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
 const sec=(title,list,f)=>{const S=mk("section","gsec");S.append(mk("h2",null,title));const G=mk("div","ggrid");list.forEach(x=>G.append(f(x)));S.append(G);g.append(S);};
 const card=(src,t,p)=>{const c=mk("div","gcard");const im=new Image();im.src=src;im.alt=t;im.loading="lazy";c.append(im);const tt=mk("div","gt");tt.append(mk("b",null,t),mk("p",null,p));c.append(tt);c.onclick=()=>lbx(src,t);return c;};
 if(v==="pc"){sec("أنواع الخلايا النباتية (صور مجهرية)",PCELLS,([k,t,p])=>card("img/pc-"+k+".jpg",t,p));sec("أمثلة على خلايا من أجزاء مختلفة من النبات",PEX,([k,t,p])=>card("img/pc-"+k+".jpg",t,p));}
 else sec("أشكال الخلايا البكتيرية",BACT,([k,t,n,sci,p])=>{const c=mk("div","gcard");const two=mk("div","two");[["img/sem-"+k+".jpg","مجهر إلكتروني (ملوّنة)"],["img/micro-"+k+".jpg","مجهر ضوئي (صبغة غرام)"]].forEach(([src,l])=>{const w=mk("div");const im=new Image();im.src=src;im.alt=t;im.loading="lazy";im.onclick=e=>{e.stopPropagation();lbx(src,t+" · "+l);};w.append(im,mk("span",null,l));two.append(w);});
  c.append(two);const tt=mk("div","gt");tt.append(mk("b",null,t),mk("i",null,n+" · "+sci),mk("p",null,p));c.append(tt);c.style.cursor="default";return c;});
 g.append(mk("p","foot","اضغطي على أي صورة لتكبيرها."));}
function setView(v){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));const isC=v==="cmp",isG=v==="pc"||v==="bc";document.getElementById("main").style.display=isC||isG?"none":"";document.getElementById("cmp").style.display=isC?"":"none";document.getElementById("gal").style.display=isG?"":"none";document.getElementById("bQuiz").style.display=isC||isG?"none":"";
 if(isG)gallery(v);else if(isC)cmp();else{view=v;if(quiz){quiz=null;const b=document.getElementById("bQuiz");b.classList.remove("on");b.textContent="🎯 اختبري نفسك";}build();}history.replaceState(null,"","#"+v);}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.getElementById("bQuiz").onclick=e=>{const b=e.currentTarget;if(quiz){quiz=null;b.classList.remove("on");b.textContent="🎯 اختبري نفسك";sel=null;paint();showInfo();return;}
 b.classList.add("on");b.textContent="⏹️ إنهاء الاختبار";quiz={ok:0,n:0,done:new Set()};sel=null;toast("غطّيتُ الأسماء… أين العضيّة؟");nextQ();};
(()=>{const bk=document.getElementById("back");if(window!==window.top){bk.style.display="none";return;}
 let ref=null;try{if(document.referrer&&new URL(document.referrer).origin===location.origin)ref=document.referrer;}catch(e){}
 bk.onclick=e=>{e.preventDefault();if(history.length>1&&ref)history.back();else if(ref)location.href=ref;else location.href=bk.getAttribute("href");};})();
const h0=location.hash.slice(1);setView(["an","pl","cmp","pc","bc"].includes(h0)?h0:"an");
