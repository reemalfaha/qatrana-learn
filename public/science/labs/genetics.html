<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الوراثة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#FBF7F3;--card:#fff;--ink:#2B1218;--muted:#76606A;--line:#ead9cf;--wine:#7A1F2E;--wine2:#5C1622;--gold:#B8902A;--gold2:#F3DFA8;--ok:#1f8f5b;--bad:#c2410c;--soft:#f6ece6;
 --f:"Noto Naskh Arabic",system-ui,Tahoma,sans-serif;--fd:"El Messiri","Noto Naskh Arabic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160e11;--card:#22171b;--ink:#f6e9ec;--muted:#c4abb3;--line:#3b2a30;--soft:#2b1d22;--gold2:#f3dfa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#160e11;--card:#22171b;--ink:#f6e9ec;--muted:#c4abb3;--line:#3b2a30;--soft:#2b1d22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--f)}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
header.hd{background:linear-gradient(135deg,var(--wine2),var(--wine));color:#fff;border-radius:18px;padding:16px 18px;border-bottom:4px solid var(--gold)}
header.hd h1{font-family:var(--fd);margin:0;font-size:clamp(24px,4.5vw,36px)}
header.hd p{margin:4px 0 0;color:var(--gold2)}
header.hd a{color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:700 15px var(--f);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--wine);border-color:var(--wine);color:#fff}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:860px){.bench{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 20px rgba(60,20,30,.07)}
canvas{display:block;width:100%;touch-action:none;border-radius:12px;background:#f3eee6;cursor:grab}
.ctl{display:flex;flex-direction:column;gap:10px;min-width:0}
.bench>*{min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:700 15px var(--f);border:0;border-radius:12px;padding:8px 14px;background:var(--wine);color:#fff;cursor:pointer;min-height:42px}
.btn.g{background:var(--soft);color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#2b1a00}
.btn:active{transform:scale(.97)}
label.l{font-weight:700;font-size:14px;color:var(--muted)}
select,input{min-width:0;max-width:100%;font:600 16px var(--f);border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--card);color:var(--ink);min-height:42px}
.read{font:700 28px/1.3 ui-monospace,Menlo,monospace;direction:ltr;text-align:center;background:var(--soft);border-radius:12px;padding:8px}
.calc{background:#fffaf0;border:1.5px dashed var(--gold);border-radius:12px;padding:10px;font-size:15px}
@media (prefers-color-scheme:dark){.calc{background:#2a2114}}
.calc b{color:var(--wine)}
@media (prefers-color-scheme:dark){.calc b{color:var(--gold2)}}
.msg{font-weight:700;border-radius:10px;padding:8px 10px}
.msg.ok{background:#e3f6ec;color:var(--ok)}.msg.no{background:#fdeee6;color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border:1px solid var(--line);padding:4px 6px;text-align:center}
th{background:var(--soft)}
.tip{font-size:14px;color:var(--muted)}
.sw{display:inline-flex;gap:6px;align-items:center;font-weight:600;cursor:pointer}
.sw input{width:20px;height:20px;min-height:0}
footer{text-align:center;color:var(--muted);font-size:13px}
html.embed header.hd,html.embed footer{display:none!important}
html.embed .wrap{padding-top:6px}
</style>
<script>try{if(self!==top)document.documentElement.classList.add("embed")}catch(e){}</script>
</head>
<body>
<div class="wrap">
<header class="hd"><h1>🧬 مختبر الوراثة</h1><p>اختاري الصفة وطراز الأبوين الجيني، وتوقّعي، ثم شاهدي صفات الأبناء في مربّع بانيت</p>
<p><a href="../#/labs">→ العودة إلى منصّة العلوم</a></p></header>
<div class="tabs" role="tablist">
 <button role="tab" data-m="cross">🧪 مختبر الصفات</button>
 <button role="tab" data-m="detective">🕵️ تحدّي المحقّقة</button>
 <button role="tab" data-m="solve">📝 مسائل محلولة</button>
 <button role="tab" data-m="me">🙋 صفاتي أنا</button>
</div>
<div id="app"></div>
<footer>تصميمُ المنصّة وتنفيذُها: نوال بني عطية · مدرسة القطرانة الثانوية للبنات</footer>
</div>
<style>
.traits{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.traits b{font-size:14px;color:var(--muted);margin-inline-start:6px}
.tr{font:700 15px var(--f);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:42px}
.tr[aria-pressed="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}
.parents{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:12px}
@media (max-width:700px){.parents{grid-template-columns:1fr}.x{transform:rotate(90deg)}}
.par{text-align:center}
.par h3{margin:0 0 6px;font-family:var(--fd)}
.pic{width:150px;height:150px;margin:0 auto;display:block}
.gts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.gt{font:800 18px/1 ui-monospace,monospace;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:62px}
.gt small{display:block;font:600 11px var(--f);margin-top:4px;color:var(--muted)}
.gt[aria-pressed="true"]{border-color:var(--gold);background:#fbf1d6}
.ph{font-weight:800;color:var(--wine);margin-top:6px}
.x{font-size:40px;text-align:center;color:var(--gold);pointer-events:none;line-height:1}
.pred{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pun{display:grid;grid-template-columns:70px repeat(2,minmax(0,1fr));grid-template-rows:70px repeat(2,auto);gap:6px;max-width:560px;margin:10px auto}
.pun .gam{display:flex;align-items:center;justify-content:center;border-radius:50%;width:56px;height:56px;margin:auto;font:800 24px ui-monospace,monospace;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.gam.f{background:#2563c9}.gam.m{background:#c2297a}
.cell{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center;opacity:0;transform:scale(.6);transition:.45s}
.cell.on{opacity:1;transform:none}
.cell svg{width:84px;height:84px}
.cell b{display:block;font:800 22px ui-monospace,monospace;letter-spacing:2px}
.cell small{color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 54px;gap:8px;align-items:center;font-weight:700}
.bar .t{height:24px;border-radius:12px;background:var(--soft);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:12px;transition:width .8s}
.ratio{font:800 22px var(--fd);text-align:center;color:var(--wine);margin:6px 0}
.kids{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.kids svg{width:46px;height:46px}
.mytab td,.mytab th{padding:8px}
.mytab svg{width:56px;height:56px}
.card .row>svg{width:74px;height:74px;flex:0 0 auto}
.step{display:flex;gap:8px;align-items:flex-start;margin:6px 0;line-height:1.8}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--wine);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.solp{margin:8px 0}.punt{border-collapse:collapse;margin-top:4px;width:auto!important;min-width:220px}.punt td,.punt th{border:1.5px solid var(--line);padding:6px 16px;text-align:center;font:800 18px ui-monospace,monospace}
.punt .pf{color:#2563c9}.punt .pm{color:#c2297a}.sol{margin-top:6px}
.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.row{display:flex;flex-wrap:wrap}
</style>
<script>
(()=>{
const app=document.getElementById("app");
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(y==null||y===false)continue;if(x==="class")e.className=y;else if(x==="html")e.innerHTML=y;else if(x.startsWith("on"))e.addEventListener(x.slice(2),y);else e.setAttribute(x,y);}for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e;};

 height:dom=>{const top=dom?10:62;let leaves="";for(let y=top+14;y<104;y+=16)leaves+=`<ellipse cx="${(y/16)%2?48:72}" cy="${y}" rx="12" ry="6" fill="#4caf50" transform="rotate(${(y/16)%2?-25:25} ${(y/16)%2?48:72} ${y})"/>`;return `<svg viewBox="0 0 120 120" class="pic"><rect x="30" y="104" width="60" height="12" rx="3" fill="#8d5a3b"/><path d="M60 104 L60 ${top}" stroke="#2e7d32" stroke-width="5"/>${leaves}<circle cx="60" cy="${top}" r="7" fill="#b39ddb"/><text x="104" y="${top+4}" font-size="11" fill="#555">${dom?"طويل":"قصير"}</text></svg>`;},

 flower:dom=>{const c=dom?"#8e44ad":"#f5f5f5",s=dom?"#5e2a75":"#bbb";let pet="";for(let i=0;i<5;i++){const a=i*72;pet+=`<ellipse cx="60" cy="34" rx="15" ry="24" fill="${c}" stroke="${s}" stroke-width="2" transform="rotate(${a} 60 58)"/>`;}return `<svg viewBox="0 0 120 120" class="pic"><path d="M60 70 L60 116" stroke="#2e7d32" stroke-width="5"/>${pet}<circle cx="60" cy="58" r="10" fill="#f1c40f"/></svg>`;},
