<script>const el=VLab.el;const G=[...new Set(VLab.EXPS.map(e=>e.grade))];let cur="الكل";
function draw(){const f=document.getElementById("flt");f.replaceChildren(...["الكل",...G].map(x=>el("button",{class:x===cur?"on":"",onclick:()=>{cur=x;draw()}},x)));
